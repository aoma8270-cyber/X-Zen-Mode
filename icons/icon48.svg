<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bgGradient48" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGradient48" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <radialGradient id="glowGradient48" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" fill="url(#bgGradient48)"/>
  
  <!-- 光の効果 -->
  <ellipse cx="24" cy="16" rx="18" ry="12" fill="url(#glowGradient48)"/>
  
  <!-- X文字 -->
  <g transform="translate(24, 24)">
    <line x1="-10" y1="-10" x2="10" y2="10" 
          stroke="url(#accentGradient48)" 
          stroke-width="5" 
          stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" 
          stroke="url(#accentGradient48)" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>
  
  <!-- 禅の円 -->
  <circle cx="24" cy="24" r="16" 
          fill="none" 
          stroke="white" 
          stroke-width="1.5" 
          stroke-opacity="0.15"/>
</svg>
